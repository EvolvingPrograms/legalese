# Sample form values for examples/landscaping-agreement.md.
# Render (from project root):
#   node $SKILL_DIR examples/landscaping-agreement.md \
#     --values-file examples/landscaping-agreement-sample.yml \
#     --output Landscaping_Services_Agreement.docx

effective_date: June 1, 2026

# Per-deal introduce expansions. `{{$the_X}}` composes the value here
# with any `def:` in schema, comma-joined, then attaches the parenthetical
# define. For these entries the schema sets no `def:`, so the value alone
# becomes the introduction prose. Use `>-` (folded) for long values so
# you can wrap lines without quote-escape gymnastics.
customer: >-
  McDonald's USA, LLC, a Delaware limited liability company, with offices at
  110 N Carpenter St, Chicago, IL 60607

contractor: >-
  Greenline Landscaping, Inc., an Illinois corporation, with offices at 4421 W
  Industrial Park Rd, Naperville, IL 60563

customer_name:    McDonald's USA, LLC
customer_entity:  Delaware limited liability company
customer_address: 110 N Carpenter St, Chicago, IL 60607

contractor_name:    Greenline Landscaping, Inc.
contractor_entity:  Illinois corporation
contractor_address: 4421 W Industrial Park Rd, Naperville, IL 60563

# Per-deal defined-term expansions. Each is the prose that appears before
# the parenthetical define when the term is introduced —
#   {{$the_Monthly_fee}} → "$1,850.00 per Location per month (the *"Monthly Fee"*)"
# Change these for a different deal without touching the template.
initial_term:        an initial term of two (2) years
renewal_term:        successive renewal terms of one (1) year each
monthly_fee:         $1,850.00 per Location per month
cure_period:         thirty (30) days
insurance_floor:     $2,000,000 per occurrence
payment_date:        the fifteenth (15th) day of each calendar month
late_fee_rate:       one and one-half percent (1.5%) per month
non_renewal_notice:  sixty (60) days
insurance_notice:    thirty (30) days

governing_law: State of Illinois
venue:         Cook County, Illinois

sig_customer_entity:   McDonald's USA, LLC
sig_customer_by:       Michael Torres
sig_customer_title:    Director of Facilities

sig_contractor_entity: Greenline Landscaping, Inc.
sig_contractor_by:     Sarah Chen
sig_contractor_title:  Chief Executive Officer

# Schedule A catalog: array of YAML paths (CWD-relative) and/or inline objects.
# Consumed by `grid: from: $locations` in the template. Mixing both forms is
# supported — pull recurring/standard locations from a checked-in YAML, then
# add one-off entries inline per deal. Each entry is `{heading?, rows}`.
locations:
  # External file — same shape as an inline entry.
  - examples/landscaping-lincoln-park.yml

  # Inline entry — block-form rows. No quotes needed; each value sits on its
  # own line out of flow context, so commas, parens, and `"` are all literal.
  - heading: Cicero — Roosevelt Rd — 5678 W Roosevelt Rd, Cicero, IL 60804
    rows:
      - service:   Mowing & Trimming
        frequency: Weekly (Apr–Oct)
        minimum:   $130 per visit
      - service:   Seasonal Planting & Mulch
        frequency: Quarterly
        minimum:   $575 per rotation
      - service:   Snow & Ice Removal
        frequency: As-needed (≥1" snow or ice event)
        minimum:   $210 per event
      - service:   Trash Policing
        frequency: Daily
        minimum:   $45 per visit

  - heading: Oak Lawn — Cicero Ave — 9012 S Cicero Ave, Oak Lawn, IL 60453
    rows:
      - service:   Mowing & Trimming
        frequency: Weekly (Apr–Oct)
        minimum:   $135 per visit
      - service:   Seasonal Planting & Mulch
        frequency: Quarterly
        minimum:   $600 per rotation
      - service:   Snow & Ice Removal
        frequency: As-needed (≥1" snow or ice event)
        minimum:   $215 per event
      - service:   Trash Policing
        frequency: Three times weekly
        minimum:   $50 per visit

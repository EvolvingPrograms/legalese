# Sample form values for examples/board-resolution.md.
# Render (from project root):
#   node $SKILL_DIR examples/board-resolution.md \
#     --values-file examples/board-resolution-sample.yml \
#     --output Board_Resolution.docx

approval_date:  April 28, 2026
effective_date: April 30, 2026

writer_name:    Sample Writer
writer_address: 123 Demo Lane, Brooklyn, NY 11201

# Long-form Writer description — `|-` block scalar so we can wrap lines
# and use literal `"` characters without quote-escape gymnastics.
writer: >-
  Sample Writer, an individual residing in Brooklyn, NY and professionally
  known as "Sample"

# Per-deal defined-term expansions. Each is the prose that appears before
# the parenthetical define when the term is introduced —
#   {{$the_Advance}} → "a recoupable advance of $25,000.00 (the *"Advance"*)"
# Change these for a different deal without touching the template.
company:           Sample Records, Inc.
advance:           a recoupable advance of $25,000.00
publishers_share:  a fifty percent (50%) share of all publisher rights
writers_share:     the remaining fifty percent (50%) share
term: >-
  an initial three (3) year term, automatically renewable for successive
  one-year periods

governing_law: State of Delaware

# Director sig values — paired into two two-sided sig blocks (1+2, 3+4)
# in the template body so all four signatures fit on one page in a 2x2 grid.
sig_director_1_name:  Alex Morgan
sig_director_1_title: Chair
sig_director_2_name:  Priya Shah
sig_director_2_title: Director
sig_director_3_name:  Devon Park
sig_director_3_title: Director
sig_director_4_name:  Rebecca Liu
sig_director_4_title: Director

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: sudo apt-get update && sudo apt-get install -y pandoc

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run pack

      - uses: softprops/action-gh-release@v2
        with:
          files: plugin.zip
          generate_release_notes: true
          append_body: true
          body: |
            ## Install as a Claude skill

            1. Download `plugin.zip` from the assets below.
            2. Open <https://claude.ai/customize/skills>.
            3. Click **+** (Create skill) → **Upload skill** → upload `plugin.zip`.

            Once installed, Claude reads [`SKILL.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/SKILL.md) and uses the bundled CLI to produce documents from a conversational request.

            ## Install as a library / CLI

            ```bash
            bun add legalese           # library
            bun add -g legalese        # global CLI: `md-to-docx`
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for full usage.

            ---

